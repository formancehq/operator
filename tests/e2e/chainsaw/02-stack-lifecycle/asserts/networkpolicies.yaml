apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: chainsaw-networkpolicies
  ownerReferences:
    - apiVersion: formance.com/v1beta1
      kind: Stack
      name: chainsaw-networkpolicies
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: chainsaw-networkpolicies
  ownerReferences:
    - apiVersion: formance.com/v1beta1
      kind: Stack
      name: chainsaw-networkpolicies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
