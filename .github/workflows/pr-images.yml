name: PR Images
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  checks: read
  contents: read

jobs:
  WaitForChecks:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'build-images') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'build-images'))
    uses: formancehq/ci/.github/workflows/wait-for-checks.yml@v1

  GoReleaser:
    needs: WaitForChecks
    runs-on: namespace-profile-linux-amd64-4vcpu
    concurrency:
      group: build-on-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true
      - uses: formancehq/ci/actions/setup-nix@v1
        with:
          nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'
      - run: nix develop --extra-experimental-features "nix-command" --extra-experimental-features "flakes" --impure --command just release-ci
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
