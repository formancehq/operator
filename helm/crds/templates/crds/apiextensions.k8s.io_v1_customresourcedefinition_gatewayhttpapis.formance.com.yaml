apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    helm.sh/resource-policy: keep
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: gatewayhttpapis.formance.com
spec:
  group: formance.com
  names:
    kind: GatewayHTTPAPI
    listKind: GatewayHTTPAPIList
    plural: gatewayhttpapis
    singular: gatewayhttpapi
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Stack
      jsonPath: .spec.stack
      name: Stack
      type: string
    - description: Ready
      jsonPath: .status.ready
      name: Ready
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: GatewayHTTPAPI is the Schema for the HTTPAPIs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              healthCheckEndpoint:
                description: Health check endpoint
                type: string
              name:
                description: Name indicates prefix api
                maxLength: 253
                type: string
              rules:
                description: Rules
                items:
                  properties:
                    backendRef:
                      description: BackendRef overrides the historical module Service
                        for this rule.
                      properties:
                        name:
                          description: Name is the backend Service name in the Stack
                            namespace.
                          maxLength: 253
                          minLength: 1
                          type: string
                        port:
                          description: Port is the backend Service port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        tls:
                          description: TLS enables a verified TLS connection to the
                            backend.
                          properties:
                            caSecretKey:
                              default: ca.crt
                              description: CASecretKey is the key containing the CA
                                certificate.
                              type: string
                            secretName:
                              description: |-
                                SecretName contains the CA used to verify the backend certificate.
                                The Secret must carry the `formance.com/gateway-backend-tls: "true"`
                                label so that certificate rotations trigger a Gateway rollout.
                              minLength: 1
                              type: string
                            serverName:
                              description: ServerName is used for backend certificate
                                verification.
                              minLength: 1
                              type: string
                          required:
                          - secretName
                          - serverName
                          type: object
                      required:
                      - name
                      - port
                      type: object
                    methods:
                      items:
                        type: string
                      type: array
                    path:
                      type: string
                    secured:
                      default: false
                      type: boolean
                  required:
                  - path
                  type: object
                maxItems: 100
                type: array
              stack:
                description: Stack indicates the stack on which the module is installed
                type: string
            required:
            - name
            - rules
            type: object
            x-kubernetes-validations:
            - message: backendRef.name must differ from spec.name because the latter
                is managed by the GatewayHTTPAPI controller
              rule: self.rules.all(rule, !has(rule.backendRef) || rule.backendRef.name
                != self.name)
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      pattern: ^([A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?)?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - status
                  - type
                  type: object
                type: array
              info:
                description: Info can contain any additional like reconciliation errors
                type: string
              ready:
                description: Ready indicates if the resource is seen as completely
                  reconciled
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
