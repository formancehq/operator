# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
project_name: operator

includes:
  - from_url:
      url: https://raw.githubusercontent.com/formancehq/earthly/refs/heads/main/.goreleaser.default-v2.yaml

builds:
  - binary: operator
    id: operator
    main: ./cmd
    ldflags:
      - -X github.com/formancehq/operator/v3/cmd.BuildDate={{ .Date }}
      - -X github.com/formancehq/operator/v3/cmd.Version=v{{ .Version }}
      - -X github.com/formancehq/operator/v3/cmd.Commit={{ .ShortCommit }}
      - -extldflags "-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - binary: operator-utils
    id: operator-utils
    dir: ./tools/utils
    ldflags:
      - -X github.com/formancehq/operator/tools/utils/v3/cmd.BuildDate={{ .Date }}
      - -X github.com/formancehq/operator/tools/utils/v3/cmd.Version=v{{ .Version }}
      - -X github.com/formancehq/operator/tools/utils/v3/cmd.Commit={{ .ShortCommit }}
      - -extldflags "-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: "{{.ProjectName}}"
    ids:
      - operator
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Os}}-{{.Arch}}"
  - id: "operator-utils"
    ids:
      - operator-utils
    formats: [tar.gz]
    name_template: "operator-utils_{{.Os}}-{{.Arch}}"

release:
  prerelease: auto
  footer: |
    ## What to do next?
    - Read the [documentation](https://docs.formance.com/)
    - Join our [GitHub Discussions](https://github.com/orgs/formancehq/discussions)

dockers_v2:
- id: operator-utils-standard
  dockerfile: ./tools/utils/build.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}'
  - '{{ if not .IsNightly }}latest{{ end }}'
  platforms:
  - linux/amd64
  - linux/arm64/v8
  flags:
  - --provenance=false
  sbom: false
  labels: &id001
    org.opencontainers.image.title: operator-utils
    org.opencontainers.image.description: operator-utils
    org.opencontainers.image.url: https://github.com/formancehq/operator
    org.opencontainers.image.source: https://github.com/formancehq/operator
    org.opencontainers.image.version: '{{ .Version }}'
    org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
    org.opencontainers.image.revision: '{{ .FullCommit }}'
    org.opencontainers.image.licenses: MIT
  ids:
  - operator-utils
- id: operator-utils-scratch
  dockerfile: ./tools/utils/scratch.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-scratch'
  - '{{ if not .IsNightly }}latest-scratch{{ end }}'
  platforms:
  - linux/amd64
  - linux/arm64/v8
  flags:
  - --provenance=false
  sbom: false
  labels: *id001
  ids:
  - operator-utils
- id: operator-utils-amd64
  dockerfile: ./tools/utils/build.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-amd64'
  platforms:
  - linux/amd64
  flags:
  - --provenance=false
  sbom: false
  labels: *id001
  ids:
  - operator-utils
- id: operator-utils-amd64-scratch
  dockerfile: ./tools/utils/scratch.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-amd64-scratch'
  platforms:
  - linux/amd64
  flags:
  - --provenance=false
  sbom: false
  labels: *id001
  ids:
  - operator-utils
- id: operator-utils-arm64
  dockerfile: ./tools/utils/build.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-arm64'
  platforms:
  - linux/arm64/v8
  flags:
  - --provenance=false
  sbom: false
  labels: *id001
  ids:
  - operator-utils
- id: operator-utils-arm64-scratch
  dockerfile: ./tools/utils/scratch.Dockerfile
  images:
  - ghcr.io/formancehq/operator-utils
  tags:
  - '{{ if not .IsNightly }}v{{ end }}{{ .Version }}-arm64-scratch'
  platforms:
  - linux/arm64/v8
  flags:
  - --provenance=false
  sbom: false
  labels: *id001
  ids:
  - operator-utils
