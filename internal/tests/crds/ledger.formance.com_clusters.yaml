apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.ledger.formance.com
spec:
  group: ledger.formance.com
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                bindAddr:
                  type: string
                  default: 0.0.0.0:7777
                  x-kubernetes-validations:
                    - rule: oldSelf == '' || self == oldSelf
                      message: bindAddr is immutable once set
                sinks:
                  type: object
                  properties:
                    nats:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - topic
                          - url
                        properties:
                          name:
                            type: string
                          topic:
                            type: string
                          url:
                            type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                appliedSinks:
                  type: array
                  items:
                    type: string
      subresources:
        status: {}
